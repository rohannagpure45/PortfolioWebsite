<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16213e" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0f3460" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="globe" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="50%" stop-color="#0f2940"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
    <filter id="arcGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="300" rx="350" ry="300" fill="url(#glow)"/>

  <!-- Globe circle -->
  <circle cx="400" cy="300" r="200" fill="url(#globe)" stroke="#1e4a6e" stroke-width="1.5" opacity="0.9"/>

  <!-- Grid lines - latitude -->
  <ellipse cx="400" cy="300" rx="200" ry="30" fill="none" stroke="#2a5a8a" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="400" cy="300" rx="200" ry="80" fill="none" stroke="#2a5a8a" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="400" cy="300" rx="200" ry="140" fill="none" stroke="#2a5a8a" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="400" cy="300" rx="200" ry="200" fill="none" stroke="#2a5a8a" stroke-width="0.5" opacity="0.3"/>

  <!-- Grid lines - longitude -->
  <ellipse cx="400" cy="300" rx="30" ry="200" fill="none" stroke="#2a5a8a" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="400" cy="300" rx="80" ry="200" fill="none" stroke="#2a5a8a" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="400" cy="300" rx="140" ry="200" fill="none" stroke="#2a5a8a" stroke-width="0.5" opacity="0.3"/>

  <!-- Simplified continent outlines - North America -->
  <path d="M310 200 Q320 190 340 195 Q355 192 360 200 Q365 210 358 220 Q350 235 340 240 Q330 248 320 250 Q305 248 295 240 Q285 230 290 215 Q295 205 310 200Z" fill="none" stroke="#4ecdc4" stroke-width="1.2" opacity="0.6"/>
  <!-- South America -->
  <path d="M340 320 Q350 310 355 315 Q360 325 358 340 Q355 360 345 375 Q335 385 330 380 Q325 370 328 355 Q330 340 335 330Z" fill="none" stroke="#4ecdc4" stroke-width="1.2" opacity="0.6"/>
  <!-- Europe/Africa -->
  <path d="M410 220 Q420 215 430 218 Q438 225 435 235 Q430 245 425 250 Q420 260 415 265 Q412 270 410 268 Q405 260 408 248 Q410 235 410 220Z" fill="none" stroke="#4ecdc4" stroke-width="1.2" opacity="0.6"/>
  <path d="M415 280 Q425 275 430 280 Q435 295 432 315 Q428 335 420 350 Q415 358 410 355 Q408 345 410 330 Q412 310 413 295Z" fill="none" stroke="#4ecdc4" stroke-width="1.2" opacity="0.6"/>
  <!-- Asia -->
  <path d="M440 200 Q460 195 480 200 Q495 208 500 220 Q502 235 495 245 Q485 255 470 258 Q455 260 445 255 Q435 248 432 238 Q430 225 435 210Z" fill="none" stroke="#4ecdc4" stroke-width="1.2" opacity="0.6"/>

  <!-- Connection arcs with glow -->
  <!-- Arc 1: North America to Europe -->
  <path d="M325 225 Q370 170 420 225" fill="none" stroke="#e94560" stroke-width="2" opacity="0.7" filter="url(#arcGlow)"/>
  <!-- Arc 2: Europe to Asia -->
  <path d="M430 230 Q460 190 475 220" fill="none" stroke="#f5a623" stroke-width="2" opacity="0.7" filter="url(#arcGlow)"/>
  <!-- Arc 3: North America to South America -->
  <path d="M320 250 Q300 285 340 325" fill="none" stroke="#e94560" stroke-width="1.5" opacity="0.6" filter="url(#arcGlow)"/>
  <!-- Arc 4: Europe to Africa -->
  <path d="M425 255 Q440 265 420 285" fill="none" stroke="#f5a623" stroke-width="1.5" opacity="0.6" filter="url(#arcGlow)"/>
  <!-- Arc 5: Asia to Africa -->
  <path d="M465 255 Q460 280 425 310" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.5" filter="url(#arcGlow)"/>
  <!-- Arc 6: Long arc NA to Asia -->
  <path d="M340 210 Q400 140 480 210" fill="none" stroke="#e94560" stroke-width="1.8" opacity="0.5" filter="url(#arcGlow)"/>

  <!-- Node points with glow -->
  <!-- North America nodes -->
  <circle cx="325" cy="225" r="4" fill="#e94560" filter="url(#nodeGlow)"/>
  <circle cx="325" cy="225" r="2" fill="#ff6b6b"/>
  <circle cx="310" cy="210" r="3" fill="#4ecdc4" filter="url(#nodeGlow)"/>
  <circle cx="310" cy="210" r="1.5" fill="#7efff5"/>

  <!-- Europe nodes -->
  <circle cx="420" cy="225" r="4" fill="#f5a623" filter="url(#nodeGlow)"/>
  <circle cx="420" cy="225" r="2" fill="#ffd700"/>
  <circle cx="430" cy="235" r="3" fill="#4ecdc4" filter="url(#nodeGlow)"/>
  <circle cx="430" cy="235" r="1.5" fill="#7efff5"/>

  <!-- Asia nodes -->
  <circle cx="475" cy="220" r="4" fill="#e94560" filter="url(#nodeGlow)"/>
  <circle cx="475" cy="220" r="2" fill="#ff6b6b"/>
  <circle cx="460" cy="230" r="3" fill="#f5a623" filter="url(#nodeGlow)"/>
  <circle cx="460" cy="230" r="1.5" fill="#ffd700"/>

  <!-- South America node -->
  <circle cx="340" cy="325" r="3.5" fill="#4ecdc4" filter="url(#nodeGlow)"/>
  <circle cx="340" cy="325" r="1.5" fill="#7efff5"/>

  <!-- Africa nodes -->
  <circle cx="420" cy="310" r="3.5" fill="#e94560" filter="url(#nodeGlow)"/>
  <circle cx="420" cy="310" r="1.5" fill="#ff6b6b"/>
  <circle cx="425" cy="285" r="3" fill="#f5a623" filter="url(#nodeGlow)"/>
  <circle cx="425" cy="285" r="1.5" fill="#ffd700"/>

  <!-- Orbiting ring -->
  <ellipse cx="400" cy="300" rx="240" ry="60" fill="none" stroke="#4ecdc4" stroke-width="0.8" opacity="0.15" transform="rotate(-20 400 300)"/>
  <ellipse cx="400" cy="300" rx="260" ry="50" fill="none" stroke="#e94560" stroke-width="0.6" opacity="0.1" transform="rotate(15 400 300)"/>

  <!-- Scattered particles -->
  <circle cx="180" cy="180" r="1.5" fill="#4ecdc4" opacity="0.4"/>
  <circle cx="620" cy="420" r="1" fill="#e94560" opacity="0.3"/>
  <circle cx="150" cy="400" r="1.2" fill="#f5a623" opacity="0.3"/>
  <circle cx="650" cy="200" r="1.5" fill="#4ecdc4" opacity="0.4"/>
  <circle cx="250" cy="500" r="1" fill="#e94560" opacity="0.25"/>
  <circle cx="550" cy="120" r="1.3" fill="#f5a623" opacity="0.35"/>
  <circle cx="700" cy="320" r="1" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="100" cy="280" r="1.2" fill="#e94560" opacity="0.2"/>

  <!-- Impact score legend bar -->
  <rect x="560" y="480" width="180" height="8" rx="4" fill="none" stroke="#2a5a8a" stroke-width="0.5" opacity="0.4"/>
  <rect x="560" y="480" width="45" height="8" rx="4" fill="#4ecdc4" opacity="0.3"/>
  <rect x="605" y="480" width="45" height="8" fill="#f5a623" opacity="0.3"/>
  <rect x="650" y="480" width="45" height="8" fill="#e94560" opacity="0.3"/>
  <rect x="695" y="480" width="45" height="8" rx="4" fill="#ff0040" opacity="0.3"/>
  <text x="560" y="505" font-family="monospace" font-size="9" fill="#6a7a8a" opacity="0.5">Low</text>
  <text x="720" y="505" font-family="monospace" font-size="9" fill="#6a7a8a" opacity="0.5" text-anchor="end">Critical</text>
</svg>
